[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-availability-checker"
version = "0.1.0"
description = "Evidence-aware domain availability and history checker"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28", "pydantic>=2.0", "PyYAML>=6.0", "typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
domain-checker = "domain_checker.cli:app"

[tool.setuptools.packages.find]
include = ["domain_checker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["domain_checker"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
